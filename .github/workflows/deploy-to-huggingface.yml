name: Deploy to Hugging Face Space

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out GitHub repository
        uses: actions/checkout@v5

      - name: Check out Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: git clone https://user:${HF_TOKEN}@huggingface.co/spaces/aravinth1007/handgesture "$RUNNER_TEMP/space"

      - name: Sync files to Hugging Face
        run: |
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            ./ "$RUNNER_TEMP/space/"
          if [ -f "$RUNNER_TEMP/space/Index.html" ]; then
            mv "$RUNNER_TEMP/space/Index.html" "$RUNNER_TEMP/space/index.html"
          fi

      - name: Commit and push changes
        working-directory: ${{ runner.temp }}/space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to deploy."
          else
            git commit -m "Deploy GitHub commit ${GITHUB_SHA}"
            git push https://user:${HF_TOKEN}@huggingface.co/spaces/aravinth1007/handgesture HEAD:main
          fi